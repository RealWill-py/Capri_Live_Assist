<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capri</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      #stage { position: absolute; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #caption {
        position: absolute; left: clamp(24px, 7vw, 110px); right: auto; bottom: clamp(36px, 8vh, 90px);
        max-width: min(440px, 42vw); padding: 18px 22px; border: 1px solid #ffffff24;
        border-radius: 20px; color: #fff; background: #171124e8; box-shadow: 0 12px 44px #08061155;
        font-size: clamp(16px, 1.5vw, 24px); line-height: 1.35; backdrop-filter: blur(14px);
        opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
      }
      #caption.visible { opacity: 1; transform: translateY(0); }
      #caption::before { content: 'CAPRI'; display: block; margin-bottom: 5px; color: #c7a8ff; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
      #panel {
        position: absolute; left: 20px; top: 20px; display: flex; gap: 8px; align-items: center;
        padding: 8px; border: 1px solid #ffffff1a; border-radius: 14px; background: #171124d9;
        color: #fff; opacity: .9; font-size: 12px; backdrop-filter: blur(12px);
      }
      button { border: 0; border-radius: 9px; padding: 8px 11px; color: #fff; background: #ffffff16; cursor: pointer; }
      button:hover, button[aria-pressed="true"] { background: #8c62d8; }
      #error { position: absolute; inset: auto 20px 20px; color: #ffd4d4; font: 14px/1.5 system-ui; }
      .overlay #panel { display: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.186.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption" role="status" aria-live="polite"></div>
    <div id="panel" aria-label="Controles de demonstração">
      <span>Avatar</span>
      <button data-action="idle" aria-pressed="true">Em espera</button>
      <button data-action="talk" aria-pressed="false">Falar</button>
      <button data-action="laugh" aria-pressed="false">Rir</button>
      <button data-action="wave" aria-pressed="false">Acenar</button>
      <button data-action="think" aria-pressed="false">Pensar</button>
    </div>
    <div id="error"></div>
    <script type="module" src="./avatar.js"></script>
  </body>
</html>
